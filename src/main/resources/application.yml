spring:
  application:
    name: helpdesk

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  flyway:
    enabled: true
    schemas: helpdesk
    default-schema: helpdesk
    baseline-on-migrate: true
    baseline-version: 1

app:
  cors:
    # Origenes permitidos separados por coma (admite patrones, ej. https://*.vercel.app)
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
